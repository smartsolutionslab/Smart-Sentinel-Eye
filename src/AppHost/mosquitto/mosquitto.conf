# Mosquitto config for dev (Aspire AppHost bind-mount).
#
# Spec 006 + ADR-0095. Plaintext listener on 1883 for dev only;
# prod uses TLS on 8883 via the Helm chart.
#
# Auth (spec 008 ADR-0100): plugin/jwt_auth.go, a custom ~180-line
# plugin of ours, validates Keycloak-minted RS256 JWTs against the realm
# JWKS (the JWKS URI is injected by AppHost as SSE_JWT_JWKS_URI). It is
# not iegomez/mosquitto-go-auth — ADR-0100 records that one being
# rejected for being HMAC-only; the "go-auth" name is inherited from the
# ADR's title.
#
# It requires: an RS256 signature from that JWKS, an exp, an aud naming
# smart-sentinel-eye-api (spec 090 — the same audience the nine HTTP
# APIs and the WHEP hook require), an azp equal to the MQTT username,
# and an iss ending in the realm path below. A non-JWT password defers
# to the password_file below, so the spec 006 seeded users keep
# working.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwords.txt
acl_file /mosquitto/config/acl.txt

plugin /mosquitto/sse-jwt-auth.so
plugin_opt_jwt_realm_path /realms/smart-sentinel-eye

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Spec 020. Deferred acknowledgement makes this the ingest ceiling.
#
# The subscriber used to acknowledge a delivery on arrival, so the in-flight
# window never filled and this setting never mattered - mosquitto's default of
# 20 was invisible. Since the acknowledgement now waits until the event is
# stored, at most this many deliveries can be outstanding at once: spec 006
# sizes this path for 5 000 events/s, and twenty in flight at that rate would
# demand an acknowledgement every 4 ms, which no database round trip will do.
#
# Not 0 (unlimited). Unlimited removes the ceiling and the backpressure with it,
# relocating an unbounded buffer into the broker where nobody is watching it -
# and FR-013 relies on this queue depth to slow the plant floor down rather than
# dropping what it sends.
max_inflight_messages 2000
