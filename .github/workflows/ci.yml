name: CI

on:
  # Every pull request, whatever it targets. Filtering to [develop, main] left
  # stacked PRs — one feature branch based on another — with no checks at all,
  # which is how a commit that did not build reached PR #1377. A stacked PR is
  # exactly the case that needs verifying: its base is unreviewed code.
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref so a force-push doesn't queue
# obsolete jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (supply-chain hardening); the trailing
# comment is the human-readable tag. The .NET SDK is pinned via global.json.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: backend — build + unit tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET (version pinned via global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        # -p:Configuration=Release so the NuGet audit runs under the same
        # config as the build. TreatWarningsAsErrors is Release-only, so a
        # default (Debug) restore leaves NU1902/NU1903 as warnings and a
        # vulnerable package can never fail this job (#1125).
        run: dotnet restore SmartSentinelEye.slnx -p:Configuration=Release

      - name: Build (Release)
        run: dotnet build SmartSentinelEye.slnx -c Release --no-restore

      # The fixture's pure decision logic needs no Docker, but it lives in
      # Integration.Tests, which coverage-check.ps1 excludes by project name —
      # so this job compiled these tests and never ran them, and their only
      # execution was the 30-minute `integration` job. Runs here, against the
      # assembly the Release build above already produced. The exclusion in
      # coverage-check.ps1 stays: it exists to keep Docker-bound tests out of
      # the coverage run, not to hide these classes.
      #
      # Selected by trait, not by class name. The name filter this replaced read
      # `~AspireFixtureReportSelectionTests`, and the very next Docker-free class
      # — AspireFixtureMigrationGateTests — did not match it, recreating the
      # omission this step exists to remove (#2064). A trait is the one selector
      # a new class cannot silently fall outside of.
      - name: Docker-free fixture logic tests
        run: |
          dotnet test tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj \
            -c Release \
            --no-build \
            --filter "Category=FixtureLogic"

      # Single test pass: coverage-check runs the unit + architecture tests once
      # (with coverage + a .trx), reusing the build above via -NoBuild, and
      # enforces the ADR-0065 gate. Previously the suite ran twice — a plain
      # test step plus coverage-check rebuilding and re-running it.
      - name: Unit + architecture tests + coverage gate (ADR-0065)
        shell: pwsh
        run: pwsh scripts/coverage-check.ps1 -Configuration Release -NoBuild

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: artifacts/coverage/report
          retention-days: 14

  frontend:
    name: frontend — lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The repo has declared a Prettier convention since it had a frontend —
      # .prettierrc.json, .prettierignore, and eslint-config-prettier in all
      # three packages so ESLint defers formatting to it. Nothing ran it, so 47
      # files had drifted out of it unnoticed (#1910). Enforced here rather than
      # left to the next person to rediscover.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  integration:
    name: integration tests (Docker)
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 30
    # Integration tests are gated on the cheaper backend job passing
    # first; no point burning the 30-minute container-startup budget on
    # a branch that already fails unit tests.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET (version pinned via global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify Docker is available
        run: docker info

      - name: Restore
        run: dotnet restore tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj -p:Configuration=Release

      - name: Build integration tests (Release)
        run: dotnet build tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj -c Release --no-restore

      - name: Run integration tests
        # Three categories are excluded. The first two are spec 020, and share a
        # reason: they measure or disturb the runner rather than the code.
        #
        # Measurement — a thirty-second saturating burst on a shared runner
        # measures the runner, and that number would later be quoted as if it
        # measured this code.
        #
        # Disruptive — restarting a resource through Aspire fails outright on
        # the runner ("Failed to stop resource"), and a test that goes red on a
        # platform limitation rather than a defect teaches people to ignore red
        # CI. The cost is real: SC-002 has no CI coverage and is verified by
        # hand instead (specs/020-durable-ingest-ack/verification.md).
        #
        # Maintenance — a sweep that operates on a long-lived run-mode stack it
        # did not start (#2004). It refuses without one, so in CI it would be a
        # guaranteed red that says nothing about the code.
        run: |
          dotnet test tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj \
            -c Release \
            --no-build \
            --filter "Category!=Measurement&Category!=Disruptive&Category!=Maintenance" \
            --logger "trx;LogFileName=integration.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  e2e:
    name: e2e (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Boots the full Aspire stack in RUN mode (web apps + gateway + Keycloak)
    # and drives the browser through it (ADR-0108). Gated on the cheap jobs so a
    # branch that already fails lint/units doesn't burn the boot budget.
    timeout-minutes: 40
    env:
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET (version pinned via global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify Docker is available
        run: docker info

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure the ASP.NET dev cert exists (Keycloak HTTPS)
        run: dotnet dev-certs https

      - name: Build the stack (Release)
        run: |
          dotnet restore SmartSentinelEye.slnx -p:Configuration=Release
          dotnet build SmartSentinelEye.slnx -c Release --no-restore

      - name: Boot the Aspire stack (run mode) in the background
        run: |
          nohup dotnet run --project src/AppHost/SmartSentinelEye.AppHost.csproj -c Release --no-build -- ScenarioSimulator=false > apphost.log 2>&1 &
          echo "$!" > apphost.pid
          echo "AppHost PID $(cat apphost.pid)"

      - name: Wait for the stack to be ready
        run: bash scripts/wait-for-e2e-stack.sh

      - name: Run the Playwright e2e suite
        run: pnpm test:e2e

      - name: AppHost log (on failure)
        if: failure()
        run: tail -n 300 apphost.log || true

      - name: Stop the AppHost
        if: always()
        run: |
          if [ -f apphost.pid ]; then kill "$(cat apphost.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
